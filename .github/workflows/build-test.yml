name: Build and Test CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-22.04

    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper logs will be placed

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Install Dependencies
        run: ./scripts/setup_robot.sh

      - name: Prepare to Build
        run: |
          rm -rf build 2>/dev/null
          cmake -S . -B build

      - name: Build Repo
        run: cmake --build build --target install -j20

      - name: Run Unit Tests
        run: ctest --verbose -R Logger.
        working-directory: build

      - name: Generate Cobertura XML
        run: |
          pip install gcovr
          gcovr \
            --exclude '_deps/.*' \
            --exclude '.*test.*' \
            -r .. . \
            --filter '.*(include|src|core)/.*\.(hpp|cpp)$' \
            --xml --xml-pretty -o coverage.xml
      
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}